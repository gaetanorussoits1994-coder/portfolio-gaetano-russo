<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive"><meta name="theme-color" content="#07111f">
  <title>Nuova password | Portfolio Admin</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="admin.css?v=1">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card" aria-labelledby="reset-title">
      <a class="admin-brand" href="../index.html"><span>GR</span><strong>Portfolio Admin</strong></a>
      <form data-reset-form novalidate hidden>
        <p class="eyebrow">Recupero password</p><h1 id="reset-title">Imposta una nuova password</h1>
        <p>Il link deve essere valido e non scaduto.</p>
        <label>Nuova password<span class="password-field"><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button class="password-toggle" type="button" data-password-toggle aria-label="Mostra password" aria-pressed="false">Mostra</button></span></label>
        <label>Conferma nuova password<span class="password-field"><input name="confirm_password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button class="password-toggle" type="button" data-password-toggle aria-label="Mostra password" aria-pressed="false">Mostra</button></span></label>
        <button class="button primary" type="submit">Aggiorna password</button>
      </form>
      <div data-reset-state><h1>Verifica del link…</h1><p>Attendi mentre viene controllata la sessione di recupero.</p></div>
      <p class="form-status" data-reset-message aria-live="polite"></p>
      <a class="back-public" href="index.html">← Torna all’accesso</a>
    </section>
  </main>
<script src="../vendor/supabase.js"></script><script src="/api/public-config"></script><script src="../js/supabase-client.js"></script><script src="common.js" defer></script><script src="reset-password.js" defer></script>
</body>
</html>
